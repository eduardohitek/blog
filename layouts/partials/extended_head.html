{{ with .Params.translationURL }}
  {{ $currentURL := $.Permalink }}
  {{ $translationURL := . | absURL }}
  {{ $isPT := strings.HasPrefix $.RelPermalink "/posts/" }}
  {{ if $isPT }}
    <link rel="alternate" hreflang="pt-BR" href="{{ $currentURL }}">
    <link rel="alternate" hreflang="en"    href="{{ $translationURL }}">
    <link rel="alternate" hreflang="x-default" href="{{ $translationURL }}">
  {{ else }}
    <link rel="alternate" hreflang="en"    href="{{ $currentURL }}">
    <link rel="alternate" hreflang="pt-BR" href="{{ $translationURL }}">
    <link rel="alternate" hreflang="x-default" href="{{ $currentURL }}">
  {{ end }}
{{ end }}
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | plainify | jsonify }}{{ end }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Person",
    "name": "Eduardo Hitek",
    "url": "https://eduardohitek.dev/about/"
  },
  "publisher": {
    "@type": "Person",
    "name": "Eduardo Hitek",
    "url": "https://eduardohitek.dev/"
  }{{ with .Params.cover }},
  "image": "{{ . | absURL }}"{{ end }}
}
</script>
{{ end }}
