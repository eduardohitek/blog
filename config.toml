baseURL = "https://eduardohitek.dev/"
languageCode = "pt-BR"
title = "Eduardo Hitek"
theme = "hitek"
disqusShortname = "blog-eduardohitek-com"
GoatCounter = "true"
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[params]
  defaultTheme = "light"
  enableThemeToggle = true
  author = "Eduardo Hitek"
  description = "Blog sobre Go, carreira em engenharia de software e ferramentas para devs."
  heroTitle = "Escrevo sobre Go e a vida de quem constrói backend desde 2006."
  heroText = "Senior Software Engineer em Brasília. Tutoriais, ferramentas e notas sobre carreira em engenharia de software, em português e inglês."
  twitterCreator = "@eduardohitek"
  images = ["/img/android-chrome-512x512.png"]
  showReadingTime = true
  minuteReadingTime = "min read"
  dateFormatSingle = "Jan 02, 2006"
  dateFormatList   = "Jan 02, 2006"
  [[params.social]]
    name = "github"
    url = "https://github.com/eduardohitek"
  [[params.social]]
    name = "twitter"
    url = "https://twitter.com/eduardohitek"
  [[params.social]]
    name = "dev"
    url = "https://dev.to/eduardohitek"
  [[params.social]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/eduardohitek/


[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = false

[taxonomies]
    tag = "tags"

[languages]
  [languages.en]
    title = "Eduardo Hitek"
    subtitle = "Personal Site and Blog"
    keywords = "software engineering, development, tutorials"
    # copyright = 'Eduardo Hitek'
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "eduardo hitek"
      logoHomeLink = "/"

  # And you can even create generic menu
  [[menu.main]]
    identifier = "blog"
    weight = 1
    name       = "Blog"
    url        = "/posts"
  [[menu.main]]
    identifier = "english"
    weight = 2
    name       = "Blog English"
    url        = "/posts-en"
  [[menu.main]]
    identifier = "talks"
    weight = 3
	name = "Talks"
	url = "/talks"
  [[menu.main]]
    identifier = "about"
    weight = 4
	name = "About"
	url = "/about"
